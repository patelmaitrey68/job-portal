services:
  - type: web
    name: job-portal-backend
    env: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: job-portal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: job-portal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: job-portal-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: job-portal-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: job-portal-db
          property: password
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: cors.allowed.origins
        value: https://job-portal-frontend.vercel.app # Placeholder, user will update

databases:
  - name: job-portal-db
    databaseName: jobportaldb
    user: admin
    plan: free
